<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Get Key - NaExecutor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .key-box { background: #0f172a; border: 2px dashed #38bdf8; padding: 12px; font-size: 18px; font-weight: bold; color: #4ade80; margin: 15px 0; word-break: break-all; }
        button { background: #38bdf8; border: none; padding: 10px 20px; font-weight: bold; color: #0f172a; border-radius: 6px; cursor: pointer; }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
<div class="card">
    <h2>NAEXECUTOR KEY SYSTEM</h2>
    <p id="status">Đang kiểm tra Key...</p>
    <div id="keyDisplay" class="key-box" style="display:none;"></div>
    <button id="copyBtn" onclick="copyKey()" style="display:none;">Copy Key</button>
</div>

<script>
    const SUPABASE_URL = "https://palwsejnhgkpfruqrphv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhbHdzZWpuaGdrcGZydXFycGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDYyMzMsImV4cCI6MjEwMzc4MjIzM30.dAAR_ChzYE8GO2mEFvRKOdl_PvlNstTkY0W2MuQSlq8";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const userHwid = urlParams.get('hwid');

    async function processKey() {
        if (!userHwid) {
            document.getElementById('status').innerText = "Lỗi: Vui lòng mở link qua ứng dụng NaExecutor!";
            document.getElementById('status').style.color = "#f87171";
            return;
        }

        const now = new Date().toISOString();

        // Kiểm tra xem máy này đã có Key còn hạn sử dụng hay chưa
        let { data: existingKeys } = await _supabase
            .from('keys')
            .select('*')
            .eq('hwid', userHwid)
            .gt('expires_at', now);

        if (existingKeys && existingKeys.length > 0) {
            showKey(existingKeys[0].key_code);
        } else {
            // Tạo Key mới hạn dùng đúng +12h 36m 36s
            const newKey = "NA-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            const expDate = new Date(Date.now() + (12 * 3600 + 36 * 60 + 36) * 1000).toISOString();

            await _supabase.from('keys').insert([{ 
                key_code: newKey, 
                hwid: userHwid,
                expires_at: expDate 
            }]);

            showKey(newKey);
        }
    }

    function showKey(key) {
        document.getElementById('status').innerText = "Key của bạn (Thời hạn: 12h 36m 36s):";
        const keyDisplay = document.getElementById('keyDisplay');
        keyDisplay.innerText = key;
        keyDisplay.style.display = "block";
        document.getElementById('copyBtn').style.display = "inline-block";
    }

    function copyKey() {
        navigator.clipboard.writeText(document.getElementById('keyDisplay').innerText);
        alert("Đã sao chép Key vào bộ nhớ tạm!");
    }

    processKey();
</script>
</body>
</html>
